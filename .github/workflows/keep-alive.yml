name: Keep Supabase Alive

on:
  schedule:
    # Run every 14 days at 2:00 AM UTC (adjust timezone as needed)
    - cron: '0 2 */14 * *'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [ main, master ]  # Run on main branch pushes for testing

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install minimal dependencies for Supabase client
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install @supabase/supabase-js@2.x

      - name: "Keep-alive: direct Supabase ping"
        run: |
          echo "Pinging Supabase to keep project active..."
          
          # Create a simple test script
          cat > test-db.js << 'EOF'
          const { createClient } = require('@supabase/supabase-js');
          
          const supabaseUrl = process.env.REACT_APP_SUPABASE_URL;
          const supabaseKey = process.env.REACT_APP_SUPABASE_ANON_KEY;
          
          if (!supabaseUrl || !supabaseKey) {
            console.error('Missing Supabase credentials');
            process.exit(1);
          }
          
          const supabase = createClient(supabaseUrl, supabaseKey);
          
          async function testConnection() {
            try {
              const { data, error } = await supabase
                .from('criteria_categories')
                .select('id')
                .limit(1);
              
              if (error) {
                console.error('Database error:', error.message);
                process.exit(1);
              }
              
              console.log('✅ Database connection successful');
              console.log('Sample data:', data);
            } catch (err) {
              console.error('Connection failed:', err.message);
              process.exit(1);
            }
          }
          
          testConnection();
          EOF
          
          # Run the test
          node test-db.js
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

      - name: Notify Success
        if: success()
        run: |
          echo "🎉 Keep-alive check completed successfully!"
          echo "Timestamp: $(date)"
          echo "Supabase project should remain active"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Keep-alive check failed!"
          echo "Timestamp: $(date)"
          echo "Check the logs above for details"

