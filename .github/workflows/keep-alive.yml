name: Keep Supabase Alive

on:
  schedule:
    # Run every 14 days at 2:00 AM UTC (adjust timezone as needed)
    - cron: '0 2 */14 * *'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [ main, master ]  # Run on main branch pushes for testing

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

      - name: Start application
        run: |
          npm install -g serve
          serve -s build -l 3000 &
          sleep 10  # Wait for app to start

      - name: Health Check
        run: |
          echo "Performing health check..."
          
          # Try the health endpoint
          HEALTH_RESPONSE=$(curl -s -w "\n%{http_code}" "http://localhost:3000/health" || echo "000")
          HTTP_CODE=$(echo "$HEALTH_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$HEALTH_RESPONSE" | head -n -1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $RESPONSE_BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passed!"
            
            # Check if response contains healthy status
            if echo "$RESPONSE_BODY" | grep -q '"status":"healthy"'; then
              echo "✅ Database connection verified!"
            else
              echo "⚠️  Health endpoint responded but database may have issues"
            fi
          else
            echo "❌ Health check failed with status: $HTTP_CODE"
            exit 1
          fi

      - name: Test Database Connection
        run: |
          echo "Testing direct database connection..."
          
          # Create a simple test script
          cat > test-db.js << 'EOF'
          const { createClient } = require('@supabase/supabase-js');
          
          const supabaseUrl = process.env.REACT_APP_SUPABASE_URL;
          const supabaseKey = process.env.REACT_APP_SUPABASE_ANON_KEY;
          
          if (!supabaseUrl || !supabaseKey) {
            console.error('Missing Supabase credentials');
            process.exit(1);
          }
          
          const supabase = createClient(supabaseUrl, supabaseKey);
          
          async function testConnection() {
            try {
              const { data, error } = await supabase
                .from('criteria_categories')
                .select('id')
                .limit(1);
              
              if (error) {
                console.error('Database error:', error.message);
                process.exit(1);
              }
              
              console.log('✅ Database connection successful');
              console.log('Sample data:', data);
            } catch (err) {
              console.error('Connection failed:', err.message);
              process.exit(1);
            }
          }
          
          testConnection();
          EOF
          
          # Run the test
          node test-db.js

      - name: Notify Success
        if: success()
        run: |
          echo "🎉 Keep-alive check completed successfully!"
          echo "Timestamp: $(date)"
          echo "Supabase project should remain active"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Keep-alive check failed!"
          echo "Timestamp: $(date)"
          echo "Check the logs above for details"

